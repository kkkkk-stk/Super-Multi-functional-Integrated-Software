name: CI

on:
  push:
    branches: [master, main]
  pull_request:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  # 编译期把警告当错误？不要 —— 先用 -D warnings 只卡 clippy，
  # 普通编译保留警告，避免上游依赖的 deprecation 直接卡死构建。
  RUST_BACKTRACE: 1

jobs:
  # ==========================================================================
  # Rust 侧：编译 + 单测 + clippy
  # ==========================================================================
  rust:
    name: Rust (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4

      - name: 安装 Rust 工具链
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - name: 安装 Linux 系统依赖
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf \
            libssl-dev \
            build-essential curl wget file libxdo-dev libayatana-appindicator3-dev

      - name: 缓存 cargo
        uses: Swatinem/rust-cache@v2
        with:
          # workspace 里的 tauri 依赖树很大，缓存命中能省几分钟
          workspaces: ". -> target"

      # frontendDist（apps/desktop/dist）是构建产物、不入库。
      # 实测 debug 下 `cargo check` 不需要它（走 devUrl），但：
      #   ① 这里要跑 `cargo clippy --all-targets`，release 语义下会需要；
      #   ② 顺手验证前端在这个平台上也能构建 —— 比单独一个 job 更早暴露问题。
      - name: 准备前端产物
        run: |
          corepack enable
          pnpm install --frozen-lockfile
          node scripts/gen-icon.mjs
          pnpm build

      - name: cargo check（全 workspace + 全部 target）
        run: cargo check --workspace --all-targets --locked

      - name: cargo test
        # 领域层与各子系统的单测 + 示例清单的端到端校验，外加**外壳 crate**。
        #
        # ⚠️ 这一行曾经写着"app crate 的测试需要 WebView，这里不跑" —— **那句话是错的**：
        # `toolforge`（外壳）目前的 16 条测试是 `settings_store`（设置落盘/坏文件隔离）、
        # `license_acks`（许可证确认指纹）与 `commands::sources_to_delete`（删源文件的边界）
        # 的纯逻辑与文件 IO，**不构造任何 Tauri 运行时、不需要 WebView**
        # （本机实测：`cargo test -p toolforge` → 16 passed / 0 failed）。
        # 那句注释把一个**本来跑得动**的覆盖挡在了 CI 外面。
        run: >
          cargo test
          -p toolforge-core
          -p toolforge-process
          -p toolforge-engines
          -p toolforge-plugins
          -p toolforge-ai
          -p toolforge
          --locked

      - name: cargo clippy
        # 这一步**必须能失败**。
        #
        # 它此前带着 `continue-on-error: true`（注释："v0.1 阶段先做提示，不卡合并"），
        # 结果是：整个 workspace 在 `-D warnings` 下攒了 **13 处错误 / 5 个 crate**
        # 而没有任何人看见 —— 因为失败的只是一个 step，整轮 CI 一直是绿的。
        # 现在 workspace 已经干净，这一步就是硬门：文档里写着"零告警"，
        # 那它就必须能红。本地同款命令：`pnpm check:clippy`。
        run: cargo clippy --workspace --all-targets --locked -- -D warnings

      - name: cargo fmt --check
        # 与上一步同理：文档的「附 A」里一直写着这条检查点"无输出"，
        # 而实测有 **271 处 diff / 30 个文件**、CI 又从不检查它 —— 于是它长期是假的声明。
        # 现在整仓已经用 `cargo fmt --all` 重排过，这一步就是让"零格式差异"这句话
        # **真的能失败**。本地同款命令：`pnpm check:fmt`。
        run: cargo fmt --all --check

  # ==========================================================================
  # 前端侧：类型检查 + 构建
  # 单独一个 job，这样前端挂了不会掩盖 Rust 的问题（反之亦然）
  # ==========================================================================
  web:
    name: Web (tsc + vite)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: 安装依赖
        run: pnpm install --frozen-lockfile

      - name: 生成图标
        # 仓库里不放二进制素材，图标由脚本即时生成
        run: node scripts/gen-icon.mjs

      - name: 校验 Windows 脚本的编码与行尾
        # 纯字节级检查，与操作系统无关 —— 但它守的是"在 Windows 上跑得起来"：
        # 没有 UTF-8 BOM 的 .ps1 会被 Windows PowerShell 5.1 按 ANSI/GBK 解码，
        # 注释里的中文会吞掉后面紧邻的 `}`，脚本连解析都过不去。
        # 详见 scripts/check-encodings.mjs 的头部注释。
        run: pnpm check:encodings

      - name: 类型检查
        run: pnpm typecheck

      - name: ESLint
        # 这一步此前**跑不了**：`pnpm lint` 是个空壳（"未安装 ESLint（可选依赖），
        # 本次回退为 tsc --noEmit"），而验收表里却写着"前端质量：typecheck + lint" ——
        # 又一条永远不会失败的验收标准。现在 ESLint 真的装了、真的在跑，
        # 21 处它提出来的问题也都处理完了（见 docs/ROADMAP.md §3.22）。
        run: pnpm lint

      - name: 构建前端
        run: pnpm build

  # ==========================================================================
  # 绑定同步检查：Rust 类型改了但没重新生成 bindings.ts 时，这个 job 会红。
  # 这是防止"前端类型悄悄过期"的唯一可靠手段。
  # ==========================================================================
  bindings:
    name: TS 绑定与 Rust 类型是否同步
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: 安装 Linux 系统依赖
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf libssl-dev build-essential curl wget file libxdo-dev libayatana-appindicator3-dev

      - uses: Swatinem/rust-cache@v2

      - name: 准备前端产物占位
        # tauri 的 generate_context! 在编译期需要 frontendDist 存在
        run: |
          pnpm install --frozen-lockfile
          pnpm build

      - name: 重新导出绑定
        run: cargo run -p toolforge --bin export-bindings

      - name: 校验绑定没有漂移
        run: |
          if ! git diff --exit-code apps/desktop/src/bindings.ts; then
            echo "::error::apps/desktop/src/bindings.ts 与 Rust 类型不同步。"
            echo "::error::请在本地运行 \`pnpm bindings\` 并提交结果。"
            exit 1
          fi

  # ==========================================================================
  # 许可证合规：引擎与模型权重的许可证清单必须与代码里的目录保持一致
  # ==========================================================================
  licenses:
    name: 引擎许可证清单一致性
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: 校验 ENGINE-MATRIX.md 覆盖了 engine_catalog() 里的每个引擎
        run: |
          missing=0
          for id in $(grep -oP 'id: "\K[a-z0-9-]+' crates/toolforge-core/src/engine.rs | sort -u); do
            if ! grep -q "\`$id\`" docs/ENGINE-MATRIX.md; then
              echo "::error::docs/ENGINE-MATRIX.md 缺少引擎 \`$id\` 的许可证说明"
              missing=1
            fi
          done
          exit $missing
