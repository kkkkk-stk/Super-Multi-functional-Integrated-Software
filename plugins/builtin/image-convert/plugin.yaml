# ToolForge L1 插件（声明式编排，零代码）
#
# ── 参数写在 `with` 里还是 `io.params` 里？─────────────────────────────────
# **两种都生效，`with` 里的显式字面量优先。**
#
# 推荐的分工：
#   * 路径与流程接线（src / dst / path / name / value）放 `with`；
#   * 用户可调的选项（format / quality / width / …）放 `io.params`，
#     并在 `with` 里用 `"${params.<id>}"` 注入 —— 这样它才会出现在 UI 表单里。
#
# 参数 id 必须与节点读取的键名逐字相同（`image.convert` 读的就是 `format` / `quality`）。
#
# ⚠️ 这条说明曾经写的是「写进 `with` 反而没有任何效果」—— 那在当时是真的，
# 但它是**设计缺陷**：几乎所有人的直觉都是把参数写进 `with`，结果被静默忽略、
# 用户拿到默认值还不知道。现在 `NodeCtx::arg_scope` 让取值先看 `with` 再看用户参数。
#
# ── 关于 `${...}` 变量 ─────────────────────────────────────────────────────
# `${src}`  = 本批次要处理的**第一个**输入文件（批量时由宿主逐文件扇出，每次一个）
# `${input.<portId>}` = 该批次输入端口下逗号连接的全部路径
# `${output.<portId>}` = 宿主已分配好的输出目标路径
# `${dst}`  = `${output.<portId>}` 的简写，按清单里**声明的端口顺序**取第一个 ——
#             结果是确定的。多输出端口时仍建议写全，读起来更清楚。
apiVersion: toolforge/v1
kind: Plugin

metadata:
  id: com.toolforge.builtin.image-convert
  name: 图片格式转换
  version: 0.1.0
  description: 在 PNG / JPEG / WebP / BMP / TIFF / GIF 之间互转。纯 Rust 解码器，无需外部引擎即可工作；支持一次拖入多张，宿主会逐张处理。
  author: ToolForge
  license: MIT
  icon: image
  category: image
  tags: [图片, 格式转换, 压缩]

# 声明 ≠ 授权：用户还要在「插件详情 → 权限」里逐条勾选。
# 形状是 `permissions: { capabilities: [ ... ] }` —— `PermissionSet` 是带
# `capabilities` 字段的结构体（刻意**没有** `#[serde(transparent)]`，这样 YAML
# 可读性好、将来还能加字段）。写成裸数组 `permissions: [ ... ]` 会解析失败：
# `permissions: invalid type: sequence, expected struct PermissionSet`。
permissions:
  capabilities:
    - kind: fsRead
      scope: { kind: input }
    - kind: fsWrite
      scope: { kind: output }

io:
  inputs:
    - id: src
      label: 源图片
      type: file
      accept: ["image/*"]
      multiple: true
      required: true
      # 多张输入现在是**真的逐张处理**：命令层会把文件数最多的输入端口展开成
      # N 个单文件批次，逐批调用一次流水线，并用「处理 3/12」上报进度。
      #
      # ⚠️ 这条注释曾经写的是「只会处理第 1 张，逐文件扇出尚未落地」—— 那在当时
      # 是真的，而且是本项目最危险的一类 bug：任务标题显示 `· 12`、实际只处理 1 张、
      # 然后**成功结束**，用户以为 12 张都好了。现在已由
      # `commands.rs::expand_batches` 修复，并有回归测试覆盖。
      description: 可一次拖入多张，宿主会按并发度逐张处理。
  outputs:
    - id: dst
      label: 输出图片
      type: file
      required: false
      description: 扩展名由「目标格式」决定。
  params:
    # id 必须叫 `format`：image.convert 节点的执行器读的就是这个键
    - id: format
      label: 目标格式
      type: enum
      description: 纯 Rust 后端的 WebP 编码只有无损模式。AVIF 未列出——默认构建的后端不支持它，装了 libvips 之后才应该加回来。
      default: { kind: str, value: webp }
      options:
        - { value: png, label: PNG（无损，支持透明） }
        - { value: jpeg, label: JPEG（有损，体积小） }
        - { value: webp, label: WebP }
        - { value: bmp, label: BMP }
        - { value: tiff, label: TIFF }
        - { value: gif, label: GIF }
      required: true
      affectsOutput: true
    # id 必须叫 `quality`
    - id: quality
      label: 质量
      type: int
      description: 仅对有损格式（jpeg）生效；纯 Rust 后端的 WebP / PNG 会忽略它。
      default: { kind: int, value: 90 }
      min: 1
      max: 100
      step: 1
      required: false

runtime:
  kind: pipeline
  pipeline:
    description: 单节点流水线：一次调用完成格式转换。
    onError: fail
    steps:
      - id: convert
        uses: image.convert
        label: 转换格式
        with:
          src: "${src}"
          dst: "${output.dst}"
