# ToolForge L1 插件（声明式编排，零代码）
#
# ── 批量是怎么发生的（先读这段，别照抄 `flow.foreach`）─────────────────────
# **多文件输入由宿主命令层扇出，清单里不需要写循环。**
# `apps/desktop/src-tauri/src/commands.rs::expand_batches` 会把文件数最多的那个
# 输入端口展开成 N 个单文件批次，逐批调用一次流水线，并用「处理 3/12」上报进度、
# 在批次边界检查取消。所以本插件只要声明 `multiple: true` 并在流水线里
# 处理**一张**图，批量语义就自动成立。
#
# `flow.foreach` 节点仍然登记在节点目录里但**执行器未实现**（会返回
# 「尚未在 v0.1 中实现」）。这里不用它 —— 用了反而跑不起来。
#
# ⚠️ 本项目踩过一次很危险的坑：宿主曾经把「12 张输入」塞进**一次**流水线调用，
# 而 `${src}` 只绑定第一张，任务却显示 `· 12` 并**成功结束** —— 用户以为 12 张
# 都处理了。现已由上述扇出修复，并有回归测试覆盖。
#
# ── 关于 `with` 与参数 ────────────────────────────────────────────────────
# 参数写在 `with` 里或 `io.params` 里**都生效**，`with` 里的显式字面量优先。
# 推荐：路径接线（src / dst / path）放 `with`；用户可调的选项放 `io.params`
# 并用 `"${params.<id>}"` 注入，这样它才会出现在 UI 表单里。
#
# 参数 id 必须与节点读取的键名逐字相同。
apiVersion: toolforge/v1
kind: Plugin

metadata:
  id: com.toolforge.builtin.batch-rename
  name: 批量重命名
  version: 0.1.0
  description: 按规则重命名一批文件：正则查找替换 + 序号/前后缀，然后落到输出目录。
  author: ToolForge
  license: MIT
  icon: text-cursor-input
  category: system
  tags: [批量, 重命名, 正则]

permissions:
  capabilities:
    - kind: fsRead
      scope: { kind: input }
    - kind: fsWrite
      scope: { kind: output }

io:
  inputs:
    - id: files
      label: 待重命名文件
      type: files
      multiple: true
      required: true
  outputs:
    - id: dst
      label: 输出目录
      type: directory
      required: false
  params:
    - id: find
      label: 正则表达式
      type: text
      description: 在文件名（不含扩展名）上匹配。留空表示不做替换。
      default: { kind: str, value: "" }
      placeholder: "IMG_(\\d+)"
      required: false
    - id: replace
      label: 替换为
      type: text
      description: 支持 $1 / $2 这类捕获组反向引用。
      default: { kind: str, value: "" }
      placeholder: "photo-$1"
      required: false
    - id: ignoreCase
      label: 忽略大小写
      type: bool
      default: { kind: bool, value: false }
      required: false
    - id: prefix
      label: 前缀
      type: text
      default: { kind: str, value: "" }
      required: false
    - id: suffix
      label: 后缀（插在扩展名之前）
      type: text
      default: { kind: str, value: "" }
      required: false
    - id: startIndex
      label: 起始序号（0 = 不追加序号）
      type: int
      default: { kind: int, value: 0 }
      min: 0
      max: 1000000
      step: 1
      required: false
    # ⚠️ 这里**不再**声明 `concurrency`。
    #
    # 并发度是**任务队列**的属性（设置页的「并发数」+ `JobQueue` 的信号量），
    # 不是插件的可调参数。曾经它被透传给 `flow.foreach` 节点，但：
    #   ① 那个节点没有执行器实现；
    #   ② 更重要 —— 并发调度属于队列的职责，混进流水线会让取消与进度上报
    #      变得极难推理（一个节点内部并行跑 N 个子任务，`${steps.x.y}` 该取谁？）。
    # 现在批量由命令层逐批扇出，队列负责限流。

runtime:
  kind: pipeline
  pipeline:
    description: 单文件重命名 + 移动到输出目录；批量由宿主逐文件扇出。
    onError: continue
    steps:
      # 这里**只处理一个文件**。批量语义来自命令层的扇出，不要写循环。
      - id: rename
        uses: fs.move
        label: 重命名并移动
        with:
          src: "${src}"
          dst: "${output.dst}"
        # 单个文件命名冲突时不中止整批：Continue 会把失败原因写进
        # `${steps.rename.error}` 供后续步骤引用（见 `l1.rs`）
        onError: continue
